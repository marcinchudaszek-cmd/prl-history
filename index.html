iego, mający na celu zdławienie opozycji demokratycznej skupionej wokół "Solidarności".',content:`Stan wojenny w Polsce Ludowej został wprowadzony w nocy z 12 na 13 grudnia 1981 roku przez Radę Państwa na wniosek Rady Ministrów pod przewodnictwem gen. Wojciecha Jaruzelskiego. Powołano Wojskową Radę Ocalenia Narodowego (WRON).

Bezpośrednią przyczyną było narastające napięcie społeczno-polityczne po powstaniu NSZZ "Solidarność" w sierpniu 1980 roku oraz obawy władz przed ewentualną interwencją sowiecką.

**Główne działania:**
- Internowanie około 10 000 działaczy opozycji i "Solidarności"
- Zawieszenie działalności związków zawodowych i organizacji społecznych
- Wprowadzenie godziny milicyjnej (22:00–6:00)
- Militaryzacja strategicznych zakładów pracy
- Wprowadzenie cenzury prewencyjnej
- Zawieszenie działalności szkół wyższych

**Pacyfikacje i ofiary:**
Najtragiczniejsze zdarzenia miały miejsce w Kopalni Węgla Kamiennego "Wujek" w Katowicach, gdzie 16 grudnia 1981 roku milicja i wojsko otworzyły ogień do strajkujących górników. Zginęło 9 osób.

Stan wojenny był oficjalnie zawieszony 31 grudnia 1982 roku, a zniesiony 22 lipca 1983 roku.`,resources:[{id:"sw-1",title:"Dekret o stanie wojennym – oryginał dokumentu",type:"akt",url:"https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=wdu19810290154",source:"ISAP – Internetowy System Aktów Prawnych Sejmu RP",description:"Oryginalny dekret Rady Państwa z dnia 12 grudnia 1981 r. o stanie wojennym",year:1981,downloadable:!0},{id:"sw-2",title:"Przemówienie gen. Jaruzelskiego – 13 grudnia 1981",type:"nagranie",url:"https://www.youtube.com/watch?v=OkmJ-PZMCj8",source:"TVP Archiwum",description:"Historyczne przemówienie telewizyjne generała Jaruzelskiego ogłaszające stan wojenny",year:1981},{id:"sw-3",title:"Archiwum stanu wojennego – IPN",type:"dokument",url:"https://ipn.gov.pl/pl/szukaj?q=stan+wojenny",source:"IPN",description:"Specjalny serwis IPN poświęcony stanowi wojennemu z dokumentami, fotografiami i relacjami",downloadable:!0},{id:"sw-4",title:"Fotografie z okresu stanu wojennego",type:"zdjęcie",url:"https://edukacja.ipn.gov.pl/edu/materialy-edukacyjne/teki-edukacyjn/stan-wojenny-19811983/155929,Fotografie.html",source:"IPN Archiwum Fotograficzne",description:"Kolekcja fotografii archiwalnych dokumentujących stan wojenny w Polsce",year:1982},{id:"sw-5",title:'"Przesłuchanie" – film Ryszarda Bugajskiego (1982)',type:"film",url:"https://ninateka.pl/",source:"NINATEKA – Filmoteka Narodowa",description:"Kultowy film zakazany przez cenzurę PRL, dokumentujący metody bezpieki",year:1982}],relatedIds:["solidarnosc","jaruzelski","wujek","sbezpieczenstwa"]},{id:"solidarnosc",title:'NSZZ „Solidarność"',subtitle:"Niezależny Samorządny Związek Zawodowy – od 1980",category:"opozycja",tags:["Wałęsa","strajki","Gdańsk","1980","związki zawodowe"],yearStart:1980,summary:'NSZZ "Solidarność" – masowy ruch społeczny i związek zawodowy, który stał się największą opozycyjną siłą w dziejach PRL i krajów bloku wschodniego.',content:`NSZZ "Solidarność" powstał w wyniku fali strajków w sierpniu 1980 roku, zapoczątkowanej w Stoczni Gdańskiej im. Lenina. 31 sierpnia 1980 roku podpisano Porozumienia Gdańskie między Międzyzakładowym Komitetem Strajkowym (MKS) a rządem PRL.

**Porozumienia Sierpniowe:**
Trzy porozumienia zawarte w Gdańsku, Szczecinie i Jastrzębiu-Zdroju przyznały pracownikom prawo do tworzenia niezależnych związków zawodowych oraz prawo do strajku.

**Lech Wałęsa** – przywódca strajku i pierwszy przewodniczący "Solidarności", w 1983 roku otrzymał Pokojową Nagrodę Nobla.

**Zasięg:**
W szczytowym momencie "Solidarność" liczyła ok. **10 milionów członków**, co stanowiło około 1/3 dorosłej ludności Polski.

**I Krajowy Zjazd Delegatów (1981):**
Uchwalono program "Samorządna Rzeczpospolita" – wizję demokratycznej, samorządnej Polski.

Po wprowadzeniu stanu wojennego "Solidarność" działała w podziemiu jako Tymczasowa Komisja Koordynacyjna. Reaktywacja nastąpiła po obradach Okrągłego Stołu w 1989 roku.`,resources:[{id:"sol-1",title:"Porozumienia Sierpniowe – artykuł IPN",type:"akt",url:"https://przystanekhistoria.pl/pa2/teksty/102990,Porozumienia.html",source:"Przystanek Historia / IPN",description:"Pełny tekst Porozumień Gdańskich, Szczecińskich i Jastrzębskich z 1980 roku",year:1980,downloadable:!0},{id:"sol-2",title:"„Robotnicy ‘80” – film dokumentalny (cały)",type:"film",url:"https://www.youtube.com/watch?v=hO-MRUjczzI",source:"Filmoteka Narodowa / YouTube",description:"Pełny film dokumentalny Chodakowskiego i Zajączkowskiego o strajku w Stoczni Gdańskiej (1980)",year:1980},{id:"sol-3",title:"Archiwum cyfrowe ECS – dokumenty i plakaty",type:"dokument",url:"https://ecs.gda.pl/en/archive/",source:"Europejskie Centrum Solidarności",description:"Archiwum dokumentów, plakatów, ulotek i wydawnictw podziemnych Solidarności",downloadable:!0},{id:"sol-4",title:"Europejskie Centrum Solidarności – zbiory cyfrowe",type:"zdjęcie",url:"https://ecs.gda.pl/",source:"Europejskie Centrum Solidarności",description:"Kolekcja fotografii i dokumentów archiwalnych ECS w Gdańsku"}],relatedIds:["stan-wojenny","okragly-stol","sierpien-1980","walesa"]},{id:"czerwiec-1956",title:"Poznański Czerwiec 1956",subtitle:"Pierwszy wielki bunt robotniczy w PRL",category:"opozycja",tags:["Poznań","strajk","robotnicy","represje","1956","odwilż"],yearStart:1956,yearEnd:1956,summary:"Poznański Czerwiec 1956 – masowy protest robotniczy w Poznaniu 28–29 czerwca 1956, brutalnie stłumiony przez wojsko i milicję. Pierwszy tak duży bunt społeczny w historii PRL.",content:`28 czerwca 1956 roku robotnicy Zakładów Przemysłu Metalowego im. Stalina (ZISPO, dziś Zakłady Przemysłu Metalowego H. Cegielski) wyszli na ulice Poznania pod hasłem **"Chleba i wolności"**.

**Przebieg wydarzeń:**
Około 100 000 osób wzięło udział w manifestacji. Demonstranci próbowali szturmować Urząd Bezpieczeństwa i więzienie. Władze odpowiedziały wysłaniem wojska i czołgów.

**Ofiary:**
- Zginęło co najmniej **57 osób** (według różnych źródeł do 74)
- Rannych zostało ponad 600 osób
- Aresztowano ponad 700 uczestników

**Następstwa:**
Bunt przyspieszył "odwilż" polityczną – dojście do władzy Władysława Gomułki w październiku 1956 roku ("Październik 1956") i pewną liberalizację systemu.

Władze przez lata ukrywały prawdziwe informacje o wydarzeniach. Rehabilitacja ofiar nastąpiła dopiero po 1989 roku.`,resources:[{id:"cz56-1",title:"Poznański Czerwiec 1956 – publikacja IPN (PDF)",type:"akt",url:"https://polskiemiesiace.ipn.gov.pl/mie/wszystkie-wydarzenia/czerwiec-1956/czytelnia/publikacje-w-formie-pdf/113969,Poznanski-Czerwiec-1956-pierwszy-bunt-spoleczenstwa-w-PRL.html",source:"IPN – Polskie Miesiące",description:'Publikacja IPN „Poznański Czerwiec 1956 – pierwszy bunt społeczeństwa w PRL" z wyborem dokumentów',year:1956,downloadable:!0},{id:"cz56-2",title:"Kronika filmowa z Poznania 1956",type:"nagranie",url:"https://www.youtube.com/watch?v=w0oY7Fkei88",source:"Archiwum TVP",description:"Archiwalne nagrania filmowe z wydarzeń poznańskich",year:1956},{id:"cz56-3",title:"Galeria zdjęć – Poznański Czerwiec 1956 (IPN)",type:"zdjęcie",url:"https://polskiemiesiace.ipn.gov.pl/mie/wszystkie-wydarzenia/czerwiec-1956",source:"IPN – Polskie Miesiące",description:"Fotografie i dokumenty z Poznańskiego Czerwca 1956 w portalu IPN"}],relatedIds:["solidarnosc","gomulka","grudzien-1970"]},{id:"grudzien-1970",title:"Grudzień 1970",subtitle:"Masakra robotników na Wybrzeżu",category:"opozycja",tags:["Gdynia","Gdańsk","Szczecin","robotnicy","strajk","1970","Gomułka","Gierek"],yearStart:1970,yearEnd:1970,summary:"Krwawe protesty robotnicze na polskim Wybrzeżu w grudniu 1970 roku, wywołane drastyczną podwyżką cen żywności. Wojsko i milicja otworzyły ogień do strajkujących. Zginęło co najmniej 45 osób.",content:`14 grudnia 1970 roku, po ogłoszeniu przez rząd drastycznych podwyżek cen żywności tuż przed Świętami Bożego Narodzenia, wybuchły protesty w Gdańsku, Gdyni, Szczecinie i Elblągu.

**Przebieg:**
- Robotnicy Stoczni Gdańskiej wyszli na ulice
- Podpalono siedzibę Komitetu Wojewódzkiego PZPR w Gdańsku
- 15–16 grudnia: wojsko i milicja otworzyły ogień na Wybrzeżu
- Szczególnie tragiczny był poranek 17 grudnia w Gdyni – żołnierze strzelali do wychodzących z pracy robotników przed stocznią

**Ofiary:**
Co najmniej **45 zabitych**, ponad 1 000 rannych, tysiące aresztowanych.

**Konsekwencje polityczne:**
Gomułka ustąpił ze stanowiska I sekretarza KC PZPR. Władzę przejął Edward Gierek obiecując "pomożecie?" – nowy kurs na konsumpcję i pożyczki zachodnie.

Przez lata władze ukrywały skalę represji. Ciała ofiar chowano potajemnie, rodzinom nie wydawano zwłok.`,resources:[{id:"gr70-1",title:"Grudzień 1970 – portal tematyczny IPN",type:"dokument",url:"https://polskiemiesiace.ipn.gov.pl/mie/wszystkie-wydarzenia/grudzien-1970",source:"IPN – Polskie Miesiące",description:"Tajne dokumenty rządowe i wojskowe z okresu Grudnia 1970",year:1970,downloadable:!0},{id:"gr70-2",title:"Nagrania TVP z Grudnia 1970",type:"nagranie",url:"https://www.youtube.com/watch?v=ryyPQ_Q9hGM",source:"TVP Archiwum",description:"Archiwalne materiały filmowe z protestów na Wybrzeżu",year:1970}],relatedIds:["czerwiec-1956","solidarnosc","gomulka","gierek"]},{id:"okragly-stol",title:"Obrady Okrągłego Stołu",subtitle:"6 lutego – 5 kwietnia 1989",category:"polityka",tags:["Wałęsa","Kiszczak","transformacja","1989","demokratyzacja"],yearStart:1989,yearEnd:1989,summary:'Negocjacje między władzami PRL a opozycją skupioną wokół "Solidarności", które doprowadziły do pokojowej transformacji ustrojowej Polski i pierwszych częściowo wolnych wyborów.',content:`Obrady Okrągłego Stołu toczyły się od 6 lutego do 5 kwietnia 1989 roku w Warszawie. Były kulminacją rozmów między stroną rządowo-koalicyjną (gen. Czesław Kiszczak) a opozycyjno-solidarnościową (Lech Wałęsa).

**Główne porozumienia:**
- Legalizacja NSZZ "Solidarność"
- Powołanie Senatu jako drugiej izby parlamentu
- Wprowadzenie urzędu Prezydenta
- Przeprowadzenie wyborów kontraktowych (4 czerwca 1989)
- Wolność słowa i mediów

**Wybory 4 czerwca 1989:**
"Solidarność" zdobyła 99 ze 100 mandatów senatorskich i wszystkie 161 wolnych mandatów w Sejmie.

**Rząd Mazowieckiego:**
12 września 1989 roku Tadeusz Mazowiecki został pierwszym niekomunistycznym premierem w bloku wschodnim.

Okrągły Stół był wzorem dla pokojowych transformacji w innych krajach bloku wschodniego.`,resources:[{id:"os-1",title:"Okrągły Stół – dokumenty i analiza (IPN)",type:"dokument",url:"https://przystanekhistoria.pl/pa2/tematy/okragly-stol,96.html",source:"Przystanek Historia / IPN",description:"Kompletny zapis stenograficzny wszystkich posiedzeń Okrągłego Stołu",year:1989,downloadable:!0},{id:"os-2",title:"Nagrania wideo z obrad – TVP Archiwum",type:"nagranie",url:"https://www.youtube.com/watch?v=nTEspBNM8Z0",source:"TVP",description:"Archiwalne nagrania telewizyjne z przebiegu obrad",year:1989},{id:"os-3",title:"Archiwum Okrągłego Stołu – IPN",type:"akt",url:"https://ipn.gov.pl/",source:"IPN",description:"Dokumenty archiwalne IPN dotyczące negocjacji i kulisów Okrągłego Stołu",downloadable:!0}],relatedIds:["solidarnosc","stan-wojenny","pzpr","walesa","jaruzelski"]},{id:"pzpr",title:"PZPR",subtitle:"Polska Zjednoczona Partia Robotnicza (1948–1990)",category:"polityka",tags:["komunizm","partia","władza","Bierut","Gomułka","Gierek","Jaruzelski"],yearStart:1948,yearEnd:1990,summary:"PZPR – monopartia komunistyczna rządząca Polską Ludową przez 42 lata. Powstała z połączenia PPR i PPS w 1948 roku, rozwiązała się dobrowolnie w 1990 roku.",content:`Polska Zjednoczona Partia Robotnicza powstała 15 grudnia 1948 roku z połączenia Polskiej Partii Robotniczej (PPR) i Polskiej Partii Socjalistycznej (PPS). Połączenie to było w praktyce wchłonięciem PPS przez komunistyczną PPR.

**Pierwsi sekretarze KC PZPR:**
1. Bolesław Bierut (1948–1956)
2. Edward Ochab (1956)
3. Władysław Gomułka (1956–1970)
4. Edward Gierek (1970–1980)
5. Stanisław Kania (1980–1981)
6. Wojciech Jaruzelski (1981–1989)
7. Mieczysław Rakowski (1989–1990)

**Struktura władzy:**
PZPR kierowała wszystkimi dziedzinami życia państwowego przez Biuro Polityczne i Komitet Centralny. Aparat partyjny przenikał administrację państwową, wojsko, gospodarkę i kulturę.

**Rozwiązanie:**
Na XI (ostatnim) Zjeździe w styczniu 1990 roku PZPR rozwiązała się, a część członków powołała Socjaldemokrację Rzeczypospolitej Polskiej (SdRP).`,resources:[{id:"pzpr-1",title:"Statut PZPR – dokumenty archiwalne AAN",type:"akt",url:"https://www.aan.gov.pl/",source:"Archiwum Akt Nowych",description:"Dokumenty organizacyjne i statuty PZPR z Archiwum Akt Nowych",downloadable:!0},{id:"pzpr-2",title:"Akta Biura Politycznego KC PZPR",type:"dokument",url:"https://szukajwarchiwach.gov.pl/",source:"Naczelna Dyrekcja Archiwów Państwowych",description:"Zdigitalizowane dokumenty KC PZPR dostępne w systemie szukajwarchiwach.gov.pl",downloadable:!0}],relatedIds:["stan-wojenny","okragly-stol","gomulka","gierek","bierut","jaruzelski"]},{id:"sbezpieczenstwa",title:"Służba Bezpieczeństwa (SB)",subtitle:"Aparat represji PRL",category:"represje",tags:["bezpieka","UB","inwigilacja","donosiciele","tajni współpracownicy"],yearStart:1956,yearEnd:1990,summary:"Służba Bezpieczeństwa – tajna policja polityczna PRL, następczyni Urzędu Bezpieczeństwa (UB). Prowadziła inwigilację obywateli, werbowała tajnych współpracowników i stosowała represje wobec opozycji.",content:`Służba Bezpieczeństwa (SB) działała w strukturach Ministerstwa Spraw Wewnętrznych PRL od 1956 do 1990 roku. Była kontynuatorem zbrodniczego Urzędu Bezpieczeństwa (UB) z lat 1944–1956.

**Metody działania:**
- Werbowanie tajnych współpracowników (TW) – szacuje się, że przez cały okres PRL SB zarejestrowała ok. 500 000–700 000 informatorów
- Inwigilacja korespondencji i podsłuchy telefoniczne
- Obserwacja fizyczna (OT – obserwacja zewnętrzna)
- "Działania operacyjne" – nękanie psychiczne, prowokacje
- Brutalne przesłuchania i tortury w latach 40. i 50.

**Departament IV:**
Specjalna jednostka ds. zwalczania Kościoła katolickiego i duchowieństwa.

**Akta SB:**
Po 1989 roku dokumenty SB przejął IPN. Szacuje się, że zachowało się ok. 1,5 miliona teczek, wiele zostało celowo zniszczonych w 1989–1990 roku.

**Działania przeciw opozycji:**
SB prowadziła Sprawę Obiektową "Lato 80" (inwigilacja Solidarności), operacje przeciw KOR, ROPCiO i innym organizacjom.`,resources:[{id:"sb-1",title:"Katalog IPN – wyszukiwarka agentów i ofiar SB",type:"dokument",url:"https://inwentarz.ipn.gov.pl/",source:"IPN – Katalog BIP",description:"Oficjalna baza danych IPN z aktami funkcjonariuszy i tajnych współpracowników SB",downloadable:!1},{id:"sb-2",title:"Inwentarz akt SB – Archiwum IPN",type:"akt",url:"https://www.ipn.gov.pl/pl/o-ipn/archiwum-ipn",source:"IPN",description:"Zasób archiwalny IPN z aktami SB i UB",downloadable:!0},{id:"sb-3",title:'Film dokumentalny "Przesłuchanie" (1982)',type:"film",url:"https://ninateka.pl/",source:"NINATEKA",description:"Kultowy film Ryszarda Bugajskiego o metodach bezpieki",year:1982}],relatedIds:["stan-wojenny","represje-polityczne","pzpr","popieluszko"]},{id:"sierpien-1980",title:"Sierpień 1980 – Strajki",subtitle:"Narodziny Solidarności w Stoczni Gdańskiej",category:"opozycja",tags:["strajk","Gdańsk","stocznia","Wałęsa","MKS","21 postulatów"],yearStart:1980,yearEnd:1980,summary:'Sierpień 1980 to miesiąc masowych strajków w Polsce, które doprowadziły do podpisania Porozumień Gdańskich i powstania NSZZ "Solidarność" – pierwszego niezależnego związku zawodowego w bloku wschodnim.',content:`14 sierpnia 1980 roku robotnicy Stoczni Gdańskiej im. Lenina rozpoczęli strajk pod przywództwem Lecha Wałęsy. Bezpośrednią przyczyną było zwolnienie z pracy Anny Walentynowicz.

**21 Postulatów MKS:**
Strajkujący sformułowali 21 postulatów, m.in.:
1. Wolne, niezależne związki zawodowe
2. Prawo do strajku
3. Wolność słowa i publikacji
4. Zwolnienie więźniów politycznych
5. Nadawanie Mszy Świętej przez radio w niedziele

**Porozumienia Gdańskie – 31 sierpnia 1980:**
Po 18 dniach strajku strona rządowa podpisała porozumienie. Dokument podpisał wicepremier Mieczysław Jagielski i Lech Wałęsa.

**Zasięg strajków:**
Do MKS przyłączyło się ponad 700 zakładów pracy z całego Wybrzeża. Strajki ogarnęły cały kraj.`,resources:[{id:"sier-1",title:"21 Postulatów – oryginalny dokument",type:"akt",url:"https://ecs.gda.pl/",source:"Europejskie Centrum Solidarności",description:"Oryginalny tekst 21 postulatów MKS zapisanych na tablicy w Stoczni Gdańskiej (Pomnik UNESCO)",year:1980,downloadable:!0},{id:"sier-2",title:"Strajk w Stoczni Gdańskiej ’80 – nagrania",type:"nagranie",url:"https://www.youtube.com/watch?v=7sAvg2e48Rg",source:"TVP / Archiwum ECS",description:"Archiwalne nagrania z przebiegu strajku w Stoczni Gdańskiej",year:1980},{id:"sier-3",title:"„Robotnicy ’80” – pełny film dokumentalny",type:"film",url:"https://www.youtube.com/watch?v=hO-MRUjczzI",source:"NINATEKA",description:"Dokument filmowy nakręcony w trakcie strajku przez Andrzeja Chodakowskiego i Andrzeja Zajączkowskiego",year:1980}],relatedIds:["solidarnosc","stan-wojenny","grudzien-1970","walesa"]},{id:"gospodarka-prl",title:"Gospodarka PRL",subtitle:"Centralnie planowana ekonomia 1944–1989",category:"gospodarka",tags:["plan","kartki","niedobory","industrializacja","dług zagraniczny"],yearStart:1944,yearEnd:1989,summary:"Gospodarka PRL oparta była na centralnym planowaniu i własności państwowej. Charakteryzowała się cyklami inwestycji, niedoborów towarowych, reglamentacji i zadłużenia zagranicznego.",content:`Gospodarka PRL opierała się na modelu sowieckim: własności państwowej środków produkcji, centralnym planowaniu i prymacie przemysłu ciężkiego.

**Główne okresy gospodarcze:**

**Plan 3-letni (1947–1949):** Odbudowa zniszczeń wojennych, nacjonalizacja przemysłu.

**Plan 6-letni (1950–1955):** Forsowna industrializacja na wzór stalinowski. Budowa Nowej Huty, Nowych Tychów, Nowej Soli. Drastyczny spadek poziomu życia.

**Gierkowska dekada (1970–1980):** Pożyczki z Zachodu, import technologii, poprawa poziomu życia. Zakończona kryzysem zadłużenia.

**Reglamentacja towarów:**
Kartki na żywność i artykuły przemysłowe wprowadzano kilkakrotnie:
- Cukier (od 1976)
- Mięso (1981–1989)
- Masło, benzyna, papierosy, alkohol, buty...

**Dług zagraniczny:**
W 1989 roku dług zewnętrzny PRL wynosił ok. **42 miliardy dolarów**.

**Czarny rynek i "kombinowanie":**
Powszechne zjawisko społeczne. "Dolar" i towary z Pewexu były twardą walutą wymiany.`,resources:[{id:"gosp-1",title:"Plany gospodarcze PRL – GUS Archiwum",type:"dokument",url:"https://stat.gov.pl/",source:"Główny Urząd Statystyczny",description:"Archiwalne roczniki statystyczne GUS z okresu PRL",downloadable:!0},{id:"gosp-2",title:'„Kolejka – symbol późnego PRL" – artykuł IPN',type:"zdjęcie",url:"https://przystanekhistoria.pl/pa2/teksty/64809,Kolejka-symbol-poznego-PRL.html",source:"IPN Fotografie",description:"Archiwalne fotografie ilustrujące codzienne trudności życia w PRL"},{id:"gosp-3",title:"Raport o stanie gospodarki – dokument KC PZPR 1981",type:"akt",url:"https://www.aan.gov.pl/",source:"Archiwum Akt Nowych",description:"Tajne raporty gospodarcze KC PZPR z lat 80.",downloadable:!0}],relatedIds:["pzpr","stan-wojenny","gierek","nowa-huta"]},{id:"kultura-prl",title:"Kultura i sztuka w PRL",subtitle:"Socrealizm, cenzura i drugie życie kultury",category:"kultura",tags:["socrealizm","cenzura","GUKPPiW","drugi obieg","samizdat"],yearStart:1944,yearEnd:1989,summary:'Kultura PRL to pasmo napięć między ideologicznym nakazem socrealizmu a wolną twórczością. Cenzura, "drugi obieg" wydawniczy i kontestacja artystyczna współistniały przez 45 lat.',content:`**Socrealizm (1949–1955):**
Obowiązująca doktryna estetyczna nakazywała tworzenie sztuki "realistycznej w formie, socjalistycznej w treści". Dotyczyła literatury, malarstwa, architektury (PKiN), muzyki i filmu.

**Cenzura – GUKPPiW:**
Główny Urząd Kontroli Prasy, Publikacji i Widowisk kontrolował całość życia kulturalnego. Każda publikacja wymagała imprimatur cenzora. Instytut Literacki w Paryżu (Kultura Jerzego Giedroycia) był głównym wydawcą emigracyjnym.

**Drugi obieg:**
Od połowy lat 70. rozwinął się potężny ruch wydawniczy poza cenzurą:
- NOWA (Niezależna Oficyna Wydawnicza)
- "Zapis", "Puls", "Res Publica"
- Podziemne nagrania i kasety magnetofonowe

**Kino PRL:**
"Szkoła polska" (Wajda, Munk, Kawalerowicz), kino moralnego niepokoju lat 70. (Zanussi, Holland, Kieślowski). Wiele filmów było zakazanych lub "półkowych".

**Teatr:**
Jerzy Grotowski, Tadeusz Kantor (Teatr Cricot 2) – artyści o światowej sławie działający w PRL.`,resources:[{id:"kult-1",title:"Akta GUKPPiW – dokumenty cenzury",type:"akt",url:"https://www.aan.gov.pl/",source:"Archiwum Akt Nowych",description:"Archiwa Głównego Urzędu Kontroli Prasy z PRL – decyzje cenzorskie",downloadable:!0},{id:"kult-2",title:'Czarna księga cenzury PRL – "Zapis" 1977',type:"publikacja",url:"https://wolnelektury.pl/",source:"Wolne Lektury",description:"Słynny dokument demaskujący działania cenzury, przemycony na Zachód",year:1977,downloadable:!0},{id:"kult-3",title:"NINATEKA – Archiwum Filmoteki Narodowej",type:"film",url:"https://ninateka.pl/",source:"Filmoteka Narodowa – Instytut Audiowizualny",description:"Największe polskie archiwum filmów, dokumentów i nagrań audio z PRL"},{id:"kult-4",title:"Plakaty PRL – kolekcja cyfrowa",type:"zdjęcie",url:"https://www.postermuseum.pl/",source:"Muzeum Plakatu w Wilanowie",description:"Cyfrowe archiwum plakatów z okresu PRL – propaganda, kultura, film"}],relatedIds:["pzpr","sbezpieczenstwa","solidarnosc"]},{id:"kosciol-prl",title:"Kościół katolicki w PRL",subtitle:"Bastion oporu wobec komunizmu",category:"społeczeństwo",tags:["Wyszyński","Jan Paweł II","pielgrzymki","religia","opór"],yearStart:1944,yearEnd:1989,summary:"Kościół katolicki był jedyną niezależną instytucją masową w PRL i głównym bastionem oporu społecznego wobec komunizmu. Pielgrzymki Jana Pawła II były przełomem w dziejach opozycji.",content:`Kościół katolicki w PRL zachował znaczną niezależność instytucjonalną, choć władze komunistyczne prowadziły z nim permanentną walkę.

**Prymas Stefan Wyszyński:**
"Prymas Tysiąclecia" (1948–1981) był symbolem oporu Kościoła. Uwięziony w latach 1953–1956. Jego polityka "non possumus" wobec komunistycznych żądań stała się legendą.

**Pielgrzymki Jana Pawła II:**
Wybór Karola Wojtyły na papieża 16 października 1978 roku był szokiem dla władz PRL.
- **I pielgrzymka (1979):** "Niech zstąpi Duch Twój i odnowi oblicze ziemi. Tej ziemi!" – słowa homilii na Placu Zwycięstwa, które stały się hasłem oporu
- **II pielgrzymka (1983):** W czasie stanu wojennego, papież spotkał się z Wałęsą
- **III pielgrzymka (1987):** "Trzeba wymagać od siebie, choćby inni od siebie nie wymagali"

**Parafia jako centrum opozycji:**
Kościoły stanowiły przestrzeń dla niezależnej kultury, edukacji i spotkań opozycji. Słynna "Msza za Ojczyznę" o. Jerzego Popiełuszki w Warszawie.

**Ks. Jerzy Popiełuszko:**
Zamordowany 19 października 1984 roku przez funkcjonariuszy SB. Jego śmierć wywołała ogromne poruszenie społeczne.`,resources:[{id:"kosc-1",title:"Jan Paweł II – pielgrzymka 1979, homilia Warszawa",type:"nagranie",url:"https://www.youtube.com/results?search_query=jan+pawel+II+pielgrzymka+1979+warszawa+homilia",source:"TVP Archiwum / Vatican Media",description:"Archiwalne nagranie homilii Jana Pawła II na Placu Zwycięstwa w 1979 roku",year:1979},{id:"kosc-2",title:"Akta SB dotyczące inwigilacji Kościoła",type:"akt",url:"https://ipn.gov.pl/",source:"IPN",description:"Dokumenty Departamentu IV SB (do spraw walki z Kościołem)",downloadable:!0}],relatedIds:["solidarnosc","stan-wojenny","sbezpieczenstwa","popieluszko"]},{id:"nowa-huta",title:"Nowa Huta",subtitle:"Socjalistyczne miasto bez kościoła",category:"społeczeństwo",tags:["urbanistyka","socrealizm","Kraków","stal","Huta im. Lenina"],yearStart:1949,summary:"Nowa Huta – wzorcowe miasto socjalistyczne wybudowane od podstaw przy Krakowie, siedziba Huty im. Lenina. Symbol industrializacji PRL, który z czasem stał się centrum oporu robotniczego.",content:`Nowa Huta powstała od podstaw od 1949 roku jako "socjalistyczne miasto przyszłości" – projekt urbanistyczny realizowany zgodnie z zasadami socrealizmu.

**Huta im. Lenina (dziś ArcelorMittal):**
Kombinat metalurgiczny był sercem Nowej Huty. W szczytowym okresie zatrudniał ok. 40 000 pracowników.

**Projekt urbanistyczny:**
Centralne Muzeum i aleja Róż (dziś aleja Jana Pawła II) tworzyły oś reprezentacyjną. Architektura wzorowana na sowieckim realizmie socjalistycznym.

**Nowa Huta bez kościoła:**
Władze celowo nie uwzględniły kościoła w projekcie. Walka parafian o budowę kościoła trwała 30 lat (1956–1977). Kościół Matki Bożej Królowej Polski ("Arka Pana") wyświęcono w 1977 roku.

**Rola w opozycji:**
Robotnicy Nowej Huty aktywnie uczestniczyli w strajkach 1980 roku i strukturach "Solidarności". Huta była jednym z kluczowych obiektów objętych stanem wojennym.`,resources:[{id:"nh-1",title:"Kronika filmowa – budowa Nowej Huty 1949-1955",type:"film",url:"https://ninateka.pl/",source:"NINATEKA / Filmoteka Narodowa",description:"Kroniki filmowe dokumentujące budowę Nowej Huty",year:1952},{id:"nh-2",title:"Fotografie archiwalne Nowej Huty",type:"zdjęcie",url:"https://www.mhk.pl/",source:"Muzeum Historyczne Krakowa – Oddział Nowa Huta",description:"Archiwalne fotografie z historii Nowej Huty"}],relatedIds:["gospodarka-prl","kultura-prl","solidarnosc"]},{id:"gomulka",title:"Władysław Gomułka",subtitle:"I sekretarz KC PZPR 1956–1970",category:"osoby",tags:["Gomułka","PZPR","październik 1956","odwilż"],yearStart:1905,yearEnd:1982,summary:'Władysław Gomułka – komunistyczny polityk, I sekretarz KC PZPR w latach 1956–1970. Symbol "odwilży" po epoce stalinowskiej, a zarazem człowiek odpowiedzialny za masakrę robotników w Grudniu 1970 i antysemicką kampanię Marca 1968.',content:`Władysław Gomułka (ur. 6 lutego 1905 – zm. 1 września 1982) był jednym z czołowych działaczy komunistycznych w Polsce.

**Przed 1956 rokiem:**
W latach 1943–1948 I sekretarz PPR. Aresztowany w 1951 roku jako "odchyleniowiec prawicowo-nacjonalistyczny" – zarzucano mu zbyt małe podporządkowanie Stalinowi. Zwolniony po śmierci Stalina.

**Październik 1956:**
Po Poznańskim Czerwcu i destalinizacji Chruszczowa Gomułka wrócił do władzy jako symbol "polskiej drogi do socjalizmu". Entuzjastycznie witany przez społeczeństwo. Ograniczył kolektywizację rolnictwa, złagodził stosunki z Kościołem i uwolnił prymasa Wyszyńskiego.

**Marzec 1968:**
Tolerował – a wg części historyków inspirował – antysemicką kampanię po studenckich protestach. Około 13 000 Polaków żydowskiego pochodzenia zmuszono do emigracji.

**Grudzień 1970:**
Wydał rozkaz użycia siły wobec strajkujących robotników na Wybrzeżu. Co najmniej 45 osób zginęło od kul milicji i wojska. Gomułka ustąpił ze stanowiska kilka dni po masakrze.

**Ocena historyczna:**
Postać kontrowersyjna – architekt względnej liberalizacji po stalinizmie, ale też odpowiedzialny za represje Marca 1968 i Grudnia 1970.`,resources:[{id:"gom-1",title:"Przemówienie Gomułki – Październik 1956",type:"nagranie",url:"https://www.youtube.com/results?search_query=gomulka+pazdziernik+1956+przemowienie+plac+defilad",source:"TVP Archiwum",description:"Archiwalne nagranie historycznego przemówienia Gomułki na Placu Defilad w październiku 1956",year:1956},{id:"gom-2",title:"Teczka Gomułki – akta IPN",type:"akt",url:"https://ipn.gov.pl/",source:"IPN",description:"Dokumenty dotyczące Władysława Gomułki w zasobach Instytutu Pamięci Narodowej",downloadable:!0},{id:"gom-3",title:"Pamiętniki Gomułki – AAN",type:"publikacja",url:"https://www.aan.gov.pl/",source:"Archiwum Akt Nowych",description:"Materiały wspomnieniowe i dokumenty osobiste Gomułki",downloadable:!0}],relatedIds:["pzpr","czerwiec-1956","grudzien-1970","marzec-1968"]},{id:"gierek",title:"Edward Gierek",subtitle:"I sekretarz KC PZPR 1970–1980",category:"osoby",tags:["Gierek","dekada Gierka","dług","konsumpcja","modernizacja"],yearStart:1913,yearEnd:2001,summary:'Edward Gierek – I sekretarz KC PZPR w latach 1970–1980. Twórca polityki "drugiej Polski" opartej na zachodnich kredytach i modernizacji. Jego dekada skończyła się kryzysem zadłużenia i narodzinami Solidarności.',content:`Edward Gierek (ur. 6 stycznia 1913 – zm. 29 lipca 2001) doszedł do władzy po Grudniu 1970, zastępując skompromitowanego Gomułkę.

**"Pomożecie?":**
Przejmując władzę, Gierek pojechał do strajkujących stoczni i zakładów pytając robotników: "Pomożecie?". Ten gest jednał mu społeczną sympatię na początku rządów.

**Dekada Gierka (1970–1980):**
Gierek realizował ambitny program modernizacji Polski finansowany zachodnimi kredytami:
- Budowa Trasy Łazienkowskiej, Dworca Centralnego, osiedli "bloków"
- Import licencji i technologii (Fiat 126p – "maluch", leki, elektronika)
- Wzrost płac realnych i poprawa zaopatrzenia sklepów
- Budowa hut, elektrowni i zakładów przemysłowych

**Spirala zadłużenia:**
Zaciągane kredyty nie były efektywnie inwestowane. W 1980 roku dług zagraniczny przekraczał **20 miliardów dolarów**. Konieczne podwyżki cen wywołały strajki sierpniowe.

**Upadek:**
W sierpniu 1980 roku, podczas strajków, Gierek był hospitalizowany. 6 września 1980 roku Biuro Polityczne odwołało go ze stanowiska. Po 1981 roku internowany przez Jaruzelskiego.`,resources:[{id:"gie-1",title:"Gierek – dokumenty KC PZPR z lat 70.",type:"akt",url:"https://www.aan.gov.pl/",source:"Archiwum Akt Nowych",description:"Dokumenty z okresu rządów Gierka – protokoły Biura Politycznego i raporty gospodarcze",downloadable:!0},{id:"gie-2",title:"Kroniki filmowe dekady Gierka",type:"film",url:"https://ninateka.pl/",source:"NINATEKA",description:'Archiwalne kroniki filmowe dokumentujące "dekadę sukcesu" Edwarda Gierka'},{id:"gie-3",title:"Fotografie z epoki Gierka – IPN",type:"zdjęcie",url:"https://ipn.gov.pl/",source:"IPN",description:"Zbiór fotografii archiwalnych z lat 70. – budowy, wizyty, życie codzienne"}],relatedIds:["pzpr","grudzien-1970","gospodarka-prl","sierpien-1980"]},{id:"jaruzelski",title:"Wojciech Jaruzelski",subtitle:"Generał, I sekretarz PZPR, Prezydent PRL",category:"osoby",tags:["Jaruzelski","stan wojenny","WRON","generał","prezydent"],yearStart:1923,yearEnd:2014,summary:"Wojciech Jaruzelski – generał i polityk, autor stanu wojennego z 13 grudnia 1981, ostatni I sekretarz KC PZPR i pierwszy Prezydent RP po 1989 roku. Postać kontrowersyjna – przez jednych oceniana jako zdrajca, przez innych jako pragmatyczny mąż stanu.",content:`Wojciech Witold Jaruzelski (ur. 6 lipca 1923 – zm. 25 maja 2014) był najważniejszą postacią późnego PRL.

**Kariera wojskowa:**
Absolwent Akademii Wojskowej w Rembertowie. Szybka kariera – generał brygady w wieku 33 lat, Minister Obrony Narodowej (1968–1983).

**Droga do władzy:**
- 1981: Premier PRL (luty)
- 1981: I sekretarz KC PZPR (październik)
- 13 XII 1981: Ogłoszenie stanu wojennego i powołanie WRON

**Stan wojenny – motywacje:**
Jaruzelski twierdził, że stan wojenny był "mniejszym złem" – alternatywą byłaby interwencja sowiecka. Historycy są podzieleni: część podziela tę ocenę, inni uważają ją za pretekst dla utrzymania władzy komunistów. Dokumenty z archiwów radzieckich wskazują, że ZSRR nie planował interwencji.

**Okrągły Stół i transformacja:**
Jaruzelski był jednym z architektów pokojowej transformacji w 1989 roku. Jako Prezydent PRL (1989–1990) przewodniczył przekazaniu władzy.

**Procesy i oskarżenia:**
W 2008 roku prokuratura IPN oskarżyła Jaruzelskiego o wydanie bezprawnych rozkazów w stanie wojennym. Procesy nie zakończyły się wyrokiem ze względu na stan zdrowia oskarżonego.`,resources:[{id:"jar-1",title:"Przemówienie Jaruzelskiego – 13 grudnia 1981",type:"nagranie",url:"https://www.youtube.com/watch?v=OkmJ-PZMCj8",source:"TVP Archiwum",description:"Oryginalne przemówienie telewizyjne generała ogłaszające stan wojenny",year:1981},{id:"jar-2",title:"Teczka Jaruzelskiego – IPN",type:"akt",url:"https://inwentarz.ipn.gov.pl/",source:"IPN",description:"Dokumenty wojskowe i partyjne Jaruzelskiego w zasobach IPN",downloadable:!0},{id:"jar-3",title:'"Stan wojenny – dlaczego?" – dokumenty i komentarze',type:"publikacja",url:"https://ipn.gov.pl/pl/publikacje/ksiazki",source:"IPN Wydawnictwo",description:"Naukowa analiza przesłanek i skutków stanu wojennego oparta na odtajnionych dokumentach",downloadable:!0}],relatedIds:["stan-wojenny","pzpr","okragly-stol","solidarnosc"]},{id:"walesa",title:"Lech Wałęsa",subtitle:"Przywódca Solidarności, Noblista, Prezydent RP",category:"osoby",tags:["Wałęsa","Solidarność","Nobel","stocznia","Gdańsk","Prezydent"],yearStart:1943,summary:"Lech Wałęsa – elektryk z Gdańska, który stał się symbolem pokojowego oporu przeciw komunizmowi. Przywódca Solidarności, laureat Pokojowej Nagrody Nobla (1983) i Prezydent RP (1990–1995).",content:`Lech Wałęsa (ur. 29 września 1943 w Popowie) wyrósł na najważniejszą postać polskiej opozycji demokratycznej i jeden z symboli pokojowych przemian w Europie Wschodniej.

**Droga do przywództwa:**
Pracownik Stoczni Gdańskiej im. Lenina, zwolniony za działalność związkową w 1976 roku. Działał w Wolnych Związkach Zawodowych Wybrzeża i KOR.

**Sierpień 1980:**
14 sierpnia 1980 roku przeskoczył przez ogrodzenie Stoczni Gdańskiej i stanął na czele strajku. Jako przewodniczący MKS podpisał Porozumienia Gdańskie 31 sierpnia 1980 roku.

**Przewodniczący Solidarności:**
Do stanu wojennego przewodził związkowi liczącemu 10 milionów członków. Po 13 grudnia 1981 roku internowany przez blisko rok.

**Pokojowa Nagroda Nobla (1983):**
Przyznana podczas stanu wojennego. Wałęsa nie pojechał do Oslo w obawie przed brakiem możliwości powrotu. Nagrodę odebrała jego żona Danuta.

**Okrągły Stół 1989:**
Przewodniczył stronie solidarnościowej w obradach zakończonych pokojową transformacją ustrojową.

**Prezydent RP (1990–1995):**
Wybrany w pierwszych wolnych wyborach prezydenckich. Jego prezydentura była naznaczona sporami z parlamentem i mediami.`,resources:[{id:"wal-1",title:"Przemówienie Wałęsy – podpisanie Porozumień Gdańskich",type:"nagranie",url:"https://ecs.gda.pl/",source:"Europejskie Centrum Solidarności",description:"Historyczne nagranie podpisania Porozumień Gdańskich przez Lecha Wałęsę",year:1980},{id:"wal-2",title:"Akta SB dotyczące inwigilacji Wałęsy",type:"akt",url:"https://inwentarz.ipn.gov.pl/",source:"IPN",description:"Dokumenty Służby Bezpieczeństwa dotyczące obserwacji i inwigilacji Wałęsy",downloadable:!0},{id:"wal-3",title:"Wykład noblowski Lecha Wałęsy (1983)",type:"dokument",url:"https://www.nobelprize.org/prizes/peace/1983/walesa/lecture/",source:"Nobel Prize Foundation",description:"Tekst wykładu noblowskiego odczytanego przez Danutę Wałęsę w Oslo",year:1983,downloadable:!0}],relatedIds:["solidarnosc","sierpien-1980","stan-wojenny","okragly-stol"]},{id:"bierut",title:"Bolesław Bierut",subtitle:"Prezydent i I sekretarz PZPR (1892–1956)",category:"osoby",tags:["Bierut","stalinizm","terror","PKWN","Konstytucja 1952"],yearStart:1892,yearEnd:1956,summary:"Bolesław Bierut – stalinowski przywódca Polski Ludowej w najciemniejszym okresie jej dziejów (1948–1956). Prezydent KRN, a następnie I sekretarz PZPR. Pod jego rządami przeprowadzono masowe represje i procesy polityczne.",content:`Bolesław Bierut (ur. 18 kwietnia 1892 – zm. 12 marca 1956 w Moskwie) był agentem sowieckim i absolutnym władcą stalinowskiej Polski.

**Droga do władzy:**
Działacz Komunistycznej Partii Polski, agent NKWD/Komintern. Po 1944 roku przewodniczący Krajowej Rady Narodowej, następnie Prezydent RP (1947–1952) z nadania komunistów.

**Stalinizacja Polski (1948–1956):**
- Likwidacja opozycji – sfałszowane wybory 1947 roku
- Masowe aresztowania i procesy polityczne (generał "Nil" August Fieldorf, rtm. Witold Pilecki i setki innych)
- Wymuszanie zeznań przez tortury w więzieniach UB
- Sowietyzacja gospodarki, kultury, wojska
- Uchwalenie stalinowskiej Konstytucji PRL (1952)

**Konstytucja 1952:**
Ustawa zasadnicza wzorowana na sowieckiej. Proklamowała "dyktaturę proletariatu" i podporządkowała Polskę modelowi radzieckiemu.

**Śmierć w Moskwie:**
Bierut uczestniczył w XX Zjeździe KPZR, gdzie Chruszczow wygłosił tajny referat o zbrodniach Stalina. Zmarł 12 marca 1956 roku w Moskwie – okoliczności śmierci nigdy nie zostały w pełni wyjaśnione.`,resources:[{id:"bie-1",title:"Akta Bieruta – IPN i AAN",type:"akt",url:"https://www.aan.gov.pl/",source:"Archiwum Akt Nowych",description:"Dokumenty osobiste i polityczne Bieruta w polskich archiwach państwowych",downloadable:!0},{id:"bie-2",title:"Konstytucja PRL z 22 lipca 1952 roku – ISAP",type:"akt",url:"https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU19520330232",source:"Internetowy System Aktów Prawnych – Sejm RP",description:"Oryginalny tekst stalinowskiej Konstytucji Polskiej Rzeczpospolitej Ludowej",year:1952,downloadable:!0},{id:"bie-3",title:"Zbrodnie stalinizmu w Polsce – dokumentacja IPN",type:"dokument",url:"https://ipn.gov.pl/pl/edukacja",source:"IPN",description:"Zestawienie najważniejszych zbrodni systemu stalinowskiego w Polsce",downloadable:!0}],relatedIds:["pzpr","represje-polityczne","gomulka"]},{id:"kor",title:"Komitet Obrony Robotników (KOR)",subtitle:"Pierwsza zorganizowana opozycja demokratyczna w PRL",category:"opozycja",tags:["KOR","Kuroń","Michnik","opozycja","Ursus","Radom","1976"],yearStart:1976,yearEnd:1981,summary:'KOR – Komitet Obrony Robotników założony w 1976 roku przez intelektualistów w obronie represjonowanych robotników z Radomia i Ursusa. Pierwsza jawna, zorganizowana opozycja w PRL, prekursor "Solidarności".',content:`Komitet Obrony Robotników powstał 23 września 1976 roku jako odpowiedź na brutalne represje wobec uczestników protestów z Radomia i Ursusa (Czerwiec 1976).

**Założyciele:**
Wśród 14 założycieli znaleźli się: Jacek Kuroń, Antoni Macierewicz, Piotr Naimski, Jan Józef Lipski, Edward Lipiński, Aniela Steinsbergowa i inni.

**Cele i metody:**
- Jawna, legalna działalność (w odróżnieniu od konspiracyjnych metod z lat wcześniejszych)
- Obrona prawna i materialna represjonowanych robotników
- Dokumentowanie i ujawnianie naruszeń praw człowieka
- Wydawanie biuletynu "Komunikat KOR" i biura porad prawnych

**Znaczenie:**
KOR przełamał barierę między inteligencją a robotnikami. Jacek Kuroń pisał: "Nie pal komitetów, zakładaj własne". Model jawnej opozycji KOR był wzorem dla całego środowiska demokratycznego.

**Przekształcenie:**
W 1977 roku KOR przekształcił się w Komitet Samoobrony Społecznej "KOR" (KSS-KOR) rozszerzając zakres działań. W 1981 roku, po legalizacji Solidarności, KOR rozwiązał się – uznał, że cel został osiągnięty.

**Wpływ na Solidarność:**
Wielu działaczy KOR weszło do struktur doradczych NSZZ "Solidarność" (Kuroń, Michnik, Geremek).`,resources:[{id:"kor-1",title:"Komitet Obrony Robotników – historia i dokumenty (IPN)",type:"akt",url:"https://ipn.gov.pl/pl/historia-z-ipn/229887,Komitet-Obrony-Robotnikow.html",source:"IPN – Historia z IPN",description:"Oryginalny apel założycielski KOR z 23 września 1976 roku",year:1976,downloadable:!0},{id:"kor-2",title:"Komunikaty KOR – zeskanowane egzemplarze",type:"publikacja",url:"https://polona.pl/",source:"Polona – Biblioteka Narodowa",description:"Cyfrowe kopie biuletynu KOR wydawanego w drugim obiegu",downloadable:!0},{id:"kor-3",title:"Teczki SB dotyczące działaczy KOR",type:"akt",url:"https://inwentarz.ipn.gov.pl/",source:"IPN",description:"Dokumenty Służby Bezpieczeństwa dotyczące inwigilacji KOR i jego działaczy",downloadable:!0}],relatedIds:["czerwiec-1976","solidarnosc","sbezpieczenstwa","marzec-1968"]},{id:"marzec-1968",title:"Marzec 1968",subtitle:"Protesty studenckie i kampania antysemicka",category:"opozycja",tags:["studenci","antysemityzm","Mickiewicz","cenzura","emigracja","1968"],yearStart:1968,yearEnd:1968,summary:'Marzec 1968 – fala studenckich protestów wywołana zakazem wystawiania "Dziadów" Mickiewicza, stłumiona przez władze. Towarzyszyła jej wewnątrzpartyjna kampania antysemicka, która zmusiła około 13 000 Polaków żydowskiego pochodzenia do emigracji.',content:`Bezpośrednią przyczyną protestów było zdjęcie z afisza spektaklu "Dziady" Adama Mickiewicza w reżyserii Kazimierza Dejmka w Teatrze Narodowym w Warszawie. Spektakl przyciągał tłumy z powodu antysowieckich skojarzeń.

**Przebieg protestów:**
- 30 stycznia 1968: ostatnie przedstawienie "Dziadów", owacje i demonstracja przed teatrem
- 8 marca 1968: wiec na dziedzińcu Uniwersytetu Warszawskiego – atak bojówek "aktywu robotniczego" (ochotnicy podstawieni przez SB)
- Marzec 1968: fala strajków i demonstracji na uczelniach w całej Polsce
- Władze użyły ZOMO i "aktywu", aresztowały setki studentów

**Kampania antysemicka:**
Frakcja "partyzantów" w PZPR (gen. Mieczysław Moczar) wykorzystała Marzec do kampanii skierowanej przeciwko Polakom żydowskiego pochodzenia:
- Czystki w wojsku, partii, mediach i na uczelniach
- Około **13 000 osób** zmuszono do emigracji (oficjalnie: "wyjazdów do Izraela")
- Wyjeżdżających pozbawiano obywatelstwa polskiego

**Ofiary i represje:**
Setki studentów aresztowanych, relegowanych z uczelni, powołanych do wojska. Wielu czołowych intelektualistów wyemigrowało (Kołakowski, Bauman).`,resources:[{id:"mar68-1",title:"Marzec 1968 – portal tematyczny IPN",type:"akt",url:"https://polskiemiesiace.ipn.gov.pl/mie/wszystkie-wydarzenia/marzec-1968",source:"IPN – Polskie Miesiące",description:"Akta bezpieki, raporty i dokumenty operacyjne z okresu Marca 1968",year:1968,downloadable:!0},{id:"mar68-2",title:"Fotografie z demonstracji studenckich 1968",type:"zdjęcie",url:"https://ipn.gov.pl/",source:"IPN Archiwum Fotograficzne",description:"Archiwalne zdjęcia z protestów studenckich i interwencji ZOMO",year:1968},{id:"mar68-3",title:'"Dziady" – spektakl Dejmka – dokumentacja',type:"dokument",url:"https://ninateka.pl/",source:"NINATEKA",description:"Materiały archiwalne dotyczące zakazanego spektaklu, który wywołał protesty",year:1968}],relatedIds:["pzpr","sbezpieczenstwa","kultura-prl","kor","gomulka"]},{id:"czerwiec-1976",title:"Czerwiec 1976",subtitle:"Protesty w Radomiu i Ursusie",category:"opozycja",tags:["Radom","Ursus","podwyżki","robotnicy","1976","KOR"],yearStart:1976,yearEnd:1976,summary:'Robotnicze protesty w Radomiu i Ursusie z 25 czerwca 1976 roku, wywołane ogłoszeniem drastycznych podwyżek cen żywności. Stłumione przez władze z użyciem brutalnych represji, w tym słynnych "ścieżek zdrowia".',content:`25 czerwca 1976 roku premier Piotr Jaroszewicz ogłosił w Sejmie drastyczne podwyżki cen żywności – mięso miało podrożeć o 69%, cukier o 100%. Kraj ogarnęła fala spontanicznych protestów.

**Przebieg wydarzeń:**
- Radom: robotnicy Zakładów Metalowych "Walter" i innych zakładów wyszli na ulice. Podpalono siedzibę Komitetu Wojewódzkiego PZPR
- Ursus: robotnicy Zakładów Mechanicznych rozkręcili tory kolejowe, blokując ruch
- Wycofanie podwyżek w ciągu 24 godzin

**Represje – "ścieżki zdrowia":**
Po stłumieniu protestów milicja organizowała tzw. "ścieżki zdrowia" – aresztowanych bito pałkami między szeregami funkcjonariuszy. Tysiące osób aresztowano, setki skazano na więzienie.

**Narodziny KOR:**
Represje wywołały bezprecedensową reakcję środowisk intelektualnych. We wrześniu 1976 roku powstał Komitet Obrony Robotników (KOR) – pierwsza jawna opozycja demokratyczna w PRL.

**Znaczenie historyczne:**
Czerwiec 1976 był bezpośrednim impulsem do powstania KOR i pośrednio – do narodzin Solidarności cztery lata później.`,resources:[{id:"cz76-1",title:"Czerwiec 1976 – portal tematyczny IPN",type:"akt",url:"https://polskiemiesiace.ipn.gov.pl/mie/wszystkie-wydarzenia/czerwiec-1976/112496,Czerwiec-1976.html",source:"IPN – Polskie Miesiące",description:"Akta procesów i dokumenty dotyczące represji po Czerwcu 1976",year:1976,downloadable:!0},{id:"cz76-2",title:"Relacje świadków – Radom 1976",type:"dokument",url:"https://ipn.gov.pl/",source:"IPN – Biuro Udostępniania",description:"Nagrane relacje uczestników i świadków wydarzeń radomskich",year:1976,downloadable:!0}],relatedIds:["kor","solidarnosc","represje-polityczne","gierek"]},{id:"popieluszko",title:"Ks. Jerzy Popiełuszko",subtitle:"Kapelan Solidarności, ofiara SB (1947–1984)",category:"osoby",tags:["Popiełuszko","SB","mord","kapelan","Solidarność","Włocławek"],yearStart:1947,yearEnd:1984,summary:'Ks. Jerzy Popiełuszko – kapłan katolicki i kapelan "Solidarności", zamordowany 19 października 1984 roku przez funkcjonariuszy Służby Bezpieczeństwa. Jego "Msze za Ojczyznę" gromadziły dziesiątki tysięcy wiernych.',content:`Jerzy Alfons Popiełuszko (ur. 14 września 1947 – zm. 19 października 1984) był wikariuszem parafii św. Stanisława Kostki na Żoliborzu w Warszawie.

**Msze za Ojczyznę:**
Od 1982 roku odprawiał comiesięczne "Msze za Ojczyznę" w kościele na Żoliborzu. Przyciągały dziesiątki tysięcy wiernych – robotników, inteligentów, członków Solidarności. Kazania ks. Jerzego były świadectwem chrześcijańskiego oporu wobec totalitaryzmu.

**Inwigilacja i prześladowania:**
SB intensywnie go inwigilowała – operacja "Popiel". Był wielokrotnie wzywany na przesłuchania, grożono mu. W 1984 roku wytoczono mu proces karny.

**Porwanie i mord:**
19 października 1984 roku, wracając z Bydgoszczy, ks. Popiełuszko został uprowadzony przez trzech funkcjonariuszy SB: Grzegorza Piotrowskiego, Waldemara Chmielewskiego i Leszka Pękalę. Skatowany, z ciężarkami u nóg, wrzucony do Zalewu Włocławskiego.

Ciało odnaleziono 30 października 1984 roku.

**Reakcja społeczna:**
Pogrzeb 3 listopada 1984 roku zgromadził szacunkowo 250 000–400 000 ludzi. Sprawcy zostali skazani – kary od 14 do 25 lat więzienia.

**Beatyfikacja:**
6 czerwca 2010 roku papież Benedykt XVI beatyfikował ks. Jerzego Popiełuszkę w Warszawie.`,resources:[{id:"pop-1",title:"Akta procesu morderców ks. Popiełuszki",type:"akt",url:"https://ipn.gov.pl/",source:"IPN",description:"Dokumenty z procesu Piotrowskiego, Chmielewskiego i Pękali przed sądem w Toruniu (1984–1985)",year:1984,downloadable:!0},{id:"pop-2",title:"Kazania ks. Popiełuszki – nagrania",type:"nagranie",url:"https://www.youtube.com/results?search_query=ksiadz+popieluszko+kazanie",source:"Archiwum Parafii / YouTube",description:"Archiwalne nagrania Mszy za Ojczyznę i kazań ks. Jerzego",year:1983},{id:"pop-3",title:'Film "Popiełuszko. Wolność jest w nas"',type:"film",url:"https://ninateka.pl/",source:"NINATEKA",description:"Film fabularny opowiadający historię życia i śmierci ks. Popiełuszki",year:2009}],relatedIds:["kosciol-prl","sbezpieczenstwa","solidarnosc","stan-wojenny"]},{id:"wujek",title:"Pacyfikacja KWK Wujek",subtitle:"16 grudnia 1981 – 9 górników zabitych",category:"represje",tags:["Wujek","górnicy","Katowice","stan wojenny","ZOMO","1981"],yearStart:1981,yearEnd:1981,summary:'Pacyfikacja Kopalni Węgla Kamiennego "Wujek" w Katowicach – 16 grudnia 1981 roku oddziały ZOMO i wojsko otworzyły ogień do strajkujących górników. Zginęło 9 osób, 23 zostały ranne. Najtragiczniejsza ze zbrodni stanu wojennego.',content:`KWK "Wujek" w Katowicach stała się symbolem zbrodni stanu wojennego.

**Strajk:**
Po ogłoszeniu stanu wojennego 13 grudnia 1981 roku górnicy KWK Wujek podjęli strajk protestacyjny. 15 grudnia oddziały ZOMO i wojska, które przez noc bezskutecznie próbowały spacyfikować strajk.

**16 grudnia 1981 roku:**
Rankiem oddziały szturmowe ZOMO, wsparte przez pluton specjalny uzbrojony w karabiny bojowe, wkroczyły na teren kopalni. Gdy górnicy stawiali opór, padły strzały.

**Ofiary – 9 zabitych górników:**
- Józef Czekalski, Krzysztof Giza, Joachim Gnida, Ryszard Gzik, Bogusław Kopczak, Andrzej Pełka, Jan Stawisiński, Zbigniew Wilk, Zenon Zając
- Rannych zostało 23 górników

**Sprawcy:**
Przez lata próbowano ukryć odpowiedzialność. W 1992 roku wszczęto śledztwo. W 2007 roku sąd skazał dowódcę plutonu specjalnego na 1 rok i 8 miesięcy więzienia w zawieszeniu – wyrok uznawano za skandalicznie łagodny.

**Upamiętnienie:**
Przy kopalni stoi Pomnik Górników Poległych w Czasie Stanu Wojennego. 16 grudnia jest dniem pamięci o ofiarach KWK Wujek.`,resources:[{id:"wuj-1",title:"Pacyfikacja Kopalni Wujek – artykuł IPN z dokumentami",type:"akt",url:"https://ipn.gov.pl/pl/historia-z-ipn/175173,Pacyfikacja-kopalni-Wujek.html",source:"IPN – Historia z IPN",description:"Dokumenty śledztwa IPN w sprawie strzelania do górników kopalni Wujek",year:1981,downloadable:!0},{id:"wuj-2",title:"Fotografie z KWK Wujek – 1981",type:"zdjęcie",url:"https://ipn.gov.pl/",source:"IPN Archiwum Fotograficzne",description:"Archiwalne zdjęcia z okresu pacyfikacji kopalni i jej następstw",year:1981},{id:"wuj-3",title:"Film dokumentalny o KWK Wujek",type:"film",url:"https://ninateka.pl/",source:"NINATEKA / TVP",description:"Dokumentalny film o historii kopalni i tragicznych wydarzeniach z 1981 roku"}],relatedIds:["stan-wojenny","sbezpieczenstwa","solidarnosc","represje-polityczne"]},{id:"represje-polityczne",title:"Represje polityczne w PRL",subtitle:"System terroru 1944–1989",category:"represje",tags:["represje","więzienia","tortury","UB","wyroki","egzekucje","wyklęci"],yearStart:1944,yearEnd:1989,summary:"Represje polityczne w PRL – system prześladowań obywateli przez aparat bezpieczeństwa, prokuraturę i sądy. W różnych formach trwały przez cały okres istnienia PRL, z największym natężeniem w latach 1944–1956.",content:`System represji politycznych w PRL przechodził przez kilka faz, choć nigdy całkowicie nie ustał.

**Faza stalinowska (1944–1956):**
Najkrwawszy okres PRL. Masowe aresztowania żołnierzy AK, PSL-owców, duchownych, "kułaków":
- Szacuje się, że przez obozy i więzienia przeszło **ok. 300 000 osób**
- Wykonano co najmniej **6 000 wyroków śmierci** (dane IPN)
- Ofiary tortur, sfabrykowanych procesów i przymusowych zeznań
- Bestialskie mordy na żołnierzach "wyklętych"

**Żołnierze wyklęci:**
Partyzanci AK i innych organizacji niepodległościowych, którzy kontynuowali walkę po 1945 roku. Ostatni z nich – Józef Franczak "Lalek" – poległ w 1963 roku.

**Faza "miękkiego terroru" (1956–1989):**
Po 1956 roku zrezygnowano z masowych egzekucji, ale represje trwały:
- Więzienia dla działaczy opozycji (KOR, Solidarność, ROPCiO)
- Inwigilacja, podsłuchy, nękanie psychiczne
- Pobicia i morderstwa (ks. Popiełuszko, operacje "likwidacyjne" SB)
- Internowanie w stanie wojennym (ok. 10 000 osób)

**Procesy rehabilitacji:**
Po 1989 roku IPN wszczął setki śledztw w sprawie zbrodni komunistycznych. Większość sprawców uniknęła kary z powodu przedawnienia lub śmierci.`,resources:[{id:"rep-1",title:"Listy ofiar represji komunistycznych – baza IPN",type:"dokument",url:"https://inwentarz.ipn.gov.pl/",source:"IPN",description:"Baza danych ofiar aparatu represji PRL – możliwość wyszukiwania po nazwisku",downloadable:!1},{id:"rep-2",title:"Akta procesów politycznych 1944–1956",type:"akt",url:"https://ipn.gov.pl/pl/o-ipn",source:"IPN",description:"Zbiory akt sądowych z procesów politycznych z epoki stalinowskiej",downloadable:!0},{id:"rep-3",title:'"Żołnierze wyklęci" – dokumentacja IPN',type:"publikacja",url:"https://zolnierzewykletipamietamy.pl/",source:"IPN",description:"Materiały edukacyjne IPN o żołnierzach niezłomnych – biogramy i dokumenty",downloadable:!0}],relatedIds:["sbezpieczenstwa","stan-wojenny","wujek","pzpr","bierut"]},{id:"lwp",title:"Ludowe Wojsko Polskie",subtitle:"Armia PRL 1943–1989",category:"wojsko",tags:["LWP","armia","Berling","Układ Warszawski","wojsko","oficerowie sowieccy"],yearStart:1943,yearEnd:1989,summary:"Ludowe Wojsko Polskie – siły zbrojne PRL podległe ZSRR przez Układ Warszawski. Tworzone od 1943 roku przez komunistów, obsadzone oficerami sowieckimi, używane do tłumienia protestów społecznych.",content:`Ludowe Wojsko Polskie (LWP) powstało w 1943 roku na terenie ZSRR jako alternatywa dla Armii Krajowej, pod patronatem sowieckim.

**Geneza:**
W 1943 roku Stalin rozkazał sformowanie 1. Dywizji Piechoty im. Tadeusza Kościuszki pod dowództwem gen. Zygmunta Berlinga. Żołnierze pochodzili w znacznej części z Polaków deportowanych do ZSRR.

**Sowietyzacja dowództwa:**
Po 1945 roku tysiące oficerów sowieckich służyło w LWP, często pod polsko brzmiącymi pseudonimami. Ministrem Obrony był w latach 1949–1956 marszałek Konstanty Rokossowski – obywatel ZSRR.

**Udział w tłumieniu protestów:**
LWP było używane do pacyfikacji społecznych:
- Czerwiec 1956 – Poznań: czołgi i piechota
- Grudzień 1970 – Wybrzeże: strzelanie do robotników
- Stan wojenny 1981 – internowania, WRON

**Układ Warszawski:**
Polska była członkiem-założycielem Układu Warszawskiego (1955). LWP było podporządkowane sowieckim strukturom dowodzenia. Polscy żołnierze uczestniczyli w interwencji w Czechosłowacji w 1968 roku.

**Transformacja:**
